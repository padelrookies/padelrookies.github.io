<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages no soporta cabeceras HTTP personalizadas (public/_headers
         es formato Netlify y aquí no se aplica), así que la CSP se hace
         cumplir por meta tag. frame-ancestors y X-Frame-Options no tienen
         equivalente en meta — solo se pueden fijar por cabecera HTTP real. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>El Racó d'en Tito — Bar-restaurant a Viladecans</title>
    <meta
      name="description"
      content="El Racó d'en Tito: bar-restaurante de barrio en Viladecans. Desayunos, bocadillos, tapas y menú del día. Terraza, wifi y opciones veganas. 4,3★ en Google."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#950AA0" />
    <link rel="canonical" href="https://elracodentito.com/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://elracodentito.com/" />
    <meta property="og:title" content="El Racó d'en Tito — Bar-restaurant a Viladecans" />
    <meta
      property="og:description"
      content="Desayunos, bocadillos, tapas y menú del día en pleno barrio de Viladecans. &quot;Menja bé, menja bo&quot;. Terraza, wifi y opciones veganas."
    />
    <meta property="og:image" content="https://elracodentito.com/images/og/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="El Racó d'en Tito — Bar-restaurant a Viladecans" />
    <meta
      name="twitter:description"
      content="Desayunos, bocadillos, tapas y menú del día en pleno barrio de Viladecans. &quot;Menja bé, menja bo&quot;. Terraza, wifi y opciones veganas."
    />
    <meta name="twitter:image" content="https://elracodentito.com/images/og/og-image.jpg" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div id="nav-root"></div>

    <main id="main-content">
      <section id="hero" class="hero" aria-label="El Racó d'en Tito — de la fachada al comedor en 360°">
        <div class="hero__frame-wrap" aria-hidden="true">
          <img class="hero__frame hero__frame--ghost" src="/images/hero/hero-fachada.jpg" alt="" decoding="async" />
          <img
            class="hero__frame hero__frame--main"
            src="/images/hero/hero-fachada.jpg"
            alt=""
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <div class="hero__flash" aria-hidden="true"></div>
        <div id="panorama-container" class="hero__panorama-mount"></div>
        <div class="hero__overlay">
          <p class="hero__eyebrow">Viladecans</p>
          <h1 class="hero__title">El Racó d'en Tito</h1>
          <p class="hero__tagline">&ldquo;Menja bé, menja bo&rdquo;</p>
          <p class="hero__scroll-hint">Desliza para entrar ↓</p>
        </div>
        <p class="hero__drag-hint">Arrastra para mirar alrededor</p>
        <button type="button" class="hero__continue-hint">Seguir bajando ↓</button>
      </section>

      <section id="ubicacion" class="section" data-component="ubicacion"></section>
    </main>

    <footer id="footer-root"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
